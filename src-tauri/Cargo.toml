[package]
name = "tauri-pdf-focus-viewer"
version = "0.1.0"
description = "A Mac-friendly PDF viewer with a focus-mode reading strip"
authors = ["machingclee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_pdf_focus_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Used by `tauri build`: serves the bundled frontend and makes `tauri::is_dev()`
# false, which is what starts the backend sidecar. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2"
getrandom = "0.3"
tokio = { version = "1", features = ["time"] }

